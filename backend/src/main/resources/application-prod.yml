spring:
  datasource:
    url: ${PLANNER_DATABASE_URL}
    username: ${PLANNER_DATABASE_USERNAME}
    password: ${PLANNER_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  # Enable only behind an explicitly trusted, header-sanitizing reverse proxy.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    redirect-context-root: false
    threads:
      max: 20
      min-spare: 2
    max-connections: 100
    accept-count: 25
  servlet:
    session:
      cookie:
        secure: true
