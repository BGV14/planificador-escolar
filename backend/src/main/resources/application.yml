spring:
  application:
    name: school-planner
  profiles:
    default: prod
  flyway:
    enabled: true
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
planner:
  bootstrap:
    username: ${PLANNER_ADMIN_USERNAME:}
    password: ${PLANNER_ADMIN_PASSWORD:}
    school: ${PLANNER_SCHOOL_NAME:}
    year: ${PLANNER_SCHOOL_YEAR:2026}
    grade: ${PLANNER_GRADE:6}
    level: ${PLANNER_LEVEL:PRIMARY}
